name: probe361-merge
# Throwaway for dotnet-software-factory #361. One dispatch is one arm.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: pull request number (empty when open_pr is true)
        required: false
        default: ''
      open_pr:
        description: open the pull request from this job with GITHUB_TOKEN
        type: boolean
        default: false
      post_ci:
        description: post build and integration check runs by API (for a PR this job opened)
        type: boolean
        default: false
      enable_auto_merge:
        description: run gh pr merge --auto --squash with GITHUB_TOKEN
        type: boolean
        default: false
      post_judge:
        description: post check run judge-verdict success
        type: boolean
        default: false
      direct_merge:
        description: run gh pr merge --squash (no --auto) with GITHUB_TOKEN at the end
        type: boolean
        default: false
      delete_branch:
        description: add --delete-branch to the merge command
        type: boolean
        default: false
jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: open pr
        if: ${{ inputs.open_pr }}
        id: open
        run: |
          set +e
          B="repair/arm4-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$B"
          echo "arm4 $GITHUB_RUN_ID" > "probe361/arm4-$GITHUB_RUN_ID.txt"
          git add probe361 && git commit -q -m "test: probe361 arm4"
          git push -u origin "$B" 2>&1 | tee push.log
          echo "::group::gh pr create"
          OUT=$(gh pr create -R "$REPO" --head "$B" --base main --title "test: probe361 arm4 (opened by GITHUB_TOKEN)" --body "Throwaway for dotnet-software-factory #361, arm 4." --label repair 2>&1); RC=$?
          echo "$OUT"; echo "rc=$RC"
          echo "::endgroup::"
          N=$(gh pr list -R "$REPO" --head "$B" --json number --jq '.[0].number')
          echo "pr=$N" >> "$GITHUB_OUTPUT"
          echo "::notice::arm4 pr create rc=$RC output=$OUT pr=$N"
      - name: resolve pr
        id: pr
        run: |
          N="${{ inputs.pr }}"; [ -n "$N" ] || N="${{ steps.open.outputs.pr }}"
          echo "number=$N" >> "$GITHUB_OUTPUT"
          SHA=$(gh pr view "$N" -R "$REPO" --json headRefOid --jq .headRefOid)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "pr=$N sha=$SHA"
      - name: post build and integration check runs
        if: ${{ inputs.post_ci }}
        run: |
          for C in build integration; do
            gh api -X POST "repos/$REPO/check-runs" -f name="$C" -f head_sha="${{ steps.pr.outputs.sha }}" -f status=completed -f conclusion=success --jq '{name, conclusion, app: .app.slug}'
          done
      - name: enable auto-merge with GITHUB_TOKEN
        if: ${{ inputs.enable_auto_merge }}
        run: |
          set +e
          DEL=""; [ "${{ inputs.delete_branch }}" = "true" ] && DEL="--delete-branch"
          OUT=$(gh pr merge "${{ steps.pr.outputs.number }}" -R "$REPO" --auto --squash $DEL 2>&1); RC=$?
          echo "$OUT"; echo "rc=$RC"
          echo "::notice::auto-merge rc=$RC output=$OUT"
          gh pr view "${{ steps.pr.outputs.number }}" -R "$REPO" --json autoMergeRequest --jq .autoMergeRequest
      - name: post judge-verdict
        if: ${{ inputs.post_judge }}
        run: |
          gh api -X POST "repos/$REPO/check-runs" -f name=judge-verdict -f head_sha="${{ steps.pr.outputs.sha }}" -f status=completed -f conclusion=success -f 'output[title]=judge verdict' -f 'output[summary]=pass (probe361)' --jq '{name, conclusion, app: .app.slug, app_id: .app.id}'
      - name: direct merge with GITHUB_TOKEN
        if: ${{ inputs.direct_merge }}
        run: |
          set +e
          sleep 5
          DEL=""; [ "${{ inputs.delete_branch }}" = "true" ] && DEL="--delete-branch"
          OUT=$(gh pr merge "${{ steps.pr.outputs.number }}" -R "$REPO" --squash $DEL 2>&1); RC=$?
          echo "$OUT"; echo "rc=$RC"
          echo "::notice::direct-merge rc=$RC output=$OUT"
      - name: state
        run: |
          sleep 10
          gh pr view "${{ steps.pr.outputs.number }}" -R "$REPO" --json state,mergedBy,mergeCommit,autoMergeRequest,mergeStateStatus
