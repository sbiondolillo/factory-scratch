# Probe for DSF: which event a pull request label fires, and which workflow file runs. Delete after the probe.
name: probe-label

on:
  pull_request:
    types: [labeled]
  pull_request_target:
    types: [labeled]
  issues:
    types: [labeled]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'review-feedback'
    steps:
      - run: |
          echo "marker=HEAD"
          echo "event=${{ github.event_name }}"
          echo "pr=${{ github.event.pull_request.number }}"
          echo "label=${{ github.event.label.name }}"
          echo "sender=${{ github.event.sender.login }}"
          echo "owner=${{ github.repository_owner }}"
          echo "ref=${{ github.ref }}"
