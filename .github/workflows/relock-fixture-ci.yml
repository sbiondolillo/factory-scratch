name: relock-fixture-ci

# Temporary probe. Runs on a pull request that touches relock-fixture/, and
# by hand. It leaves one check run, "locked-restore".
on:
  pull_request:
    paths:
      - 'relock-fixture/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: dotnet restore --locked-mode
        working-directory: relock-fixture
