name: relock-fixture-relock

# Temporary probe. On a Dependabot pull request that touches relock-fixture/,
# it regenerates every lock file, pushes the change to the pull request
# branch, and starts relock-fixture-ci on that branch.
on:
  pull_request:
    paths:
      - 'relock-fixture/**'

permissions:
  contents: write
  actions: write

jobs:
  relock:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - run: dotnet restore --force-evaluate
        working-directory: relock-fixture
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "lock files are current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*packages.lock.json'
          git commit -m "Regenerate the lock files" -m "[dependabot skip]"
          git push
          gh workflow run relock-fixture-ci.yml --ref "$GITHUB_HEAD_REF"
